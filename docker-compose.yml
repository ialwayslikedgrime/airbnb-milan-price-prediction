version: '3.9'

services:
  # Service 1: The API
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # Service 2: The Frontend
  frontend:
    build: .
    # Notice we change the URL to 'http://api:8000' because inside Docker, 
    # the services talk to each other by name ("api"), not "localhost"
    environment:
      - API_URL=http://api:8000 
    command: streamlit run app/frontend.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api

  
#Final Command:
#docker-compose up
#This single command spins up your entire architecture (Backend + Frontend) in perfect sync. If you send this folder to a friend with Docker installed, they can run your whole app with that one command, without installing Python or XGBoost themselves.